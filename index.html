<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrawlface - Generate Pareidolia Art</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <script src="scrawl.js"></script>
  <style>
    /* Control panel look (sidebar + mobile drawer) borrowed from Teenage
       Engineering hardware (OP-1): an aluminium panel, physical keycaps
       that press in, monospaced micro-labels and a fader with an LCD readout. */
    :root {
      --chassis: #d7d6d1;      /* device panel */
      --chassis-edge: #bdbcb6;
      --key: #f6f6f3;          /* keycap face */
      --key-hover: #ffffff;
      --key-edge: #a9a8a2;     /* keycap side, seen below the face */
      --key-down: #e2e1dc;
      --ink: #161616;
      --muted: #55544f;    /* 5.2:1 on --chassis, AA for small text */
      --screen: #161616;
      --te-blue: #2c6fd6;
      --te-green: #2fb35a;
      --te-orange: #ff6b1a;
      --te-orange-edge: #c24e0d;
      --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      background: #fbfbfd;
      color: #1d1d1f;
      line-height: 1.47059;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 22px;
    }

    header {
      text-align: center;
      padding: 52px 0 21px;
    }

    h1 {
      font-size: 56px;
      line-height: 1.07143;
      font-weight: 600;
      letter-spacing: -0.005em;
      margin-bottom: 6px;
      color: #1d1d1f;
    }

    .subtitle {
      font-size: 21px;
      line-height: 1.381;
      color: #6e6e73;
      font-weight: 400;
      letter-spacing: 0.011em;
      margin-top: 6px;
      margin-bottom: 0;
    }

    .canvas-section {
      display: flex;
      gap: 0;
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 2px 4px 12px rgba(0,0,0,0.08);
      margin: 40px 0;
      min-height: 600px;
    }

    .canvas-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: #ffffff;
      gap: 24px;
    }

    .canvas-controls {
      display: flex;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 800px;
    }

    .canvas-controls .cta-button {
      flex-shrink: 0;
    }

    .canvas-controls .control-group {
      flex: 1;
      max-width: 300px;
    }

    #scrawl-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #scrawl-container canvas {
      max-width: 100%;
      height: auto !important;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    /* Control panel: styled after Teenage Engineering hardware (OP-1) */
    .sidebar {
      width: 280px;
      background: var(--chassis);
      border-left: 1px solid var(--chassis-edge);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      counter-reset: section;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Numbered micro-labels: "01 tools", "02 colours", ... */
    .sidebar-section h3,
    .control-group label,
    .mobile-section-label {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: lowercase;
      letter-spacing: 0.04em;
      margin: 0;
    }

    .sidebar-section h3::before {
      counter-increment: section;
      content: counter(section, decimal-leading-zero);
      display: inline-block;
      margin-right: 8px;
      padding: 0 4px;
      color: var(--chassis);
      background: var(--muted);
      border-radius: 3px;
    }

    .sidebar .cta-button {
      width: 100%;
      justify-content: center;
    }

    .sidebar button {
      width: 100%;
    }

    .sidebar .tools-grid button {
      aspect-ratio: 1 / 1;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
    }

    .sidebar .tools-grid .clear-btn-full {
      grid-column: 1 / -1;
      aspect-ratio: auto;
      padding: 12px 24px;
    }

    /* Keycap: a light face on a darker edge; pressing pushes the face down */
    button {
      position: relative;
      background: var(--key);
      color: var(--ink);
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      line-height: 1.23536;
      font-weight: 500;
      letter-spacing: -0.01em;
      border-radius: 8px;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        0 2px 0 var(--key-edge),
        0 3px 6px rgba(0,0,0,0.12);
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, background 0.15s;
      min-width: 44px;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    @media (hover: hover) {
      button:hover {
        background: var(--key-hover);
      }
    }

    button:active {
      transform: translateY(2px);
      box-shadow:
        inset 0 1px 2px rgba(0,0,0,0.12),
        0 0 0 var(--key-edge),
        0 1px 2px rgba(0,0,0,0.1);
    }

    button:focus-visible {
      outline: 2px solid var(--te-blue);
      outline-offset: 2px;
    }

    /* Latched key: stays pressed in, with a green LED */
    button.active {
      background: var(--key-down);
      color: var(--ink);
      transform: translateY(2px);
      box-shadow:
        inset 0 1px 3px rgba(0,0,0,0.18),
        0 0 0 var(--key-edge);
    }

    button.active::after {
      content: '';
      position: absolute;
      top: 7px;
      right: 7px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--te-green);
      box-shadow: 0 0 6px var(--te-green);
    }

    @media (hover: hover) {
      button.active:hover {
        background: var(--key-down);
      }
    }

    /* Disabled: a flat outline instead of a raised key */
    button:disabled,
    button:disabled:hover {
      background: transparent;
      color: var(--muted);
      box-shadow: inset 0 0 0 1px var(--chassis-edge);
      cursor: not-allowed;
      transform: none;
    }

    .cta-button {
      background: var(--te-orange);
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.35),
        0 2px 0 var(--te-orange-edge),
        0 3px 6px rgba(0,0,0,0.15);
    }

    @media (hover: hover) {
      .cta-button:hover {
        background: #ff7b33;
      }
    }

    .bottom-toolbar {
      display: none;
    }

    .toolbar-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-divider {
      width: 1px;
      height: 32px;
      background: var(--chassis-edge);
    }

    /* Mobile toolbar styles */
    .mobile-toolbar-main {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      /* Six buttons have to fit a 360px-wide phone */
      gap: 8px;
    }

    .mobile-tool-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      /* 48px wide normally; may shrink to 40px so the row fits a 320px phone */
      flex: 0 1 48px;
      min-width: 40px;
      min-height: 48px;
      padding: 12px;
      border-radius: 10px;
      font-size: 18px;
    }

    /* The text button keeps its natural width */
    #generate-btn-mobile {
      flex: none;
      font-size: 14px;
    }

    /* The drawer slides up each time it is shown (display: none -> block) */
    @keyframes drawer-in {
      from { transform: translateY(12px); opacity: 0; }
    }

    .mobile-toolbar-expanded {
      animation: drawer-in 0.18s ease-out;
      width: 100%;
      background: var(--chassis);
      border-top: 1px solid var(--chassis-edge);
      padding: 16px;
      max-height: 60vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .mobile-section {
      margin-bottom: 20px;
    }

    .mobile-section:last-child {
      margin-bottom: 0;
    }

    .mobile-section-label {
      display: block;
      margin-bottom: 10px;
    }

    /* Always-visible strip above the tool buttons. The padding leaves room
       for the selected swatch's ring, which overflow-x would otherwise clip. */
    .mobile-color-swatches {
      display: flex;
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 5px;
    }

    .color-swatch-btn-mobile {
      min-width: 40px;
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.3),
        0 2px 0 rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    .color-swatch-btn-mobile.selected {
      border-color: var(--chassis);
      transform: translateY(2px);
      box-shadow: 0 0 0 2px var(--ink);
    }

    .mobile-size-options {
      display: flex;
      gap: 12px;
      justify-content: flex-start;
    }

    .mobile-size-btn {
      min-width: 48px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      cursor: pointer;
    }

    /* Selected size latches like the tool keys */
    .mobile-size-btn.selected {
      background: var(--key-down);
      transform: translateY(2px);
      box-shadow:
        inset 0 1px 3px rgba(0,0,0,0.18),
        0 0 0 2px var(--te-blue);
    }

    .mobile-controls-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .mobile-control-btn {
      padding: 14px 16px;
      font-size: 14px;
      min-height: 48px;
      cursor: pointer;
    }

    /* Save sits in the History row as a 4th key, so the sidebar (with two
       rows of eye sets) still fits a 720px-tall viewport */
    .tools-grid.history-grid {
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    /* 7th button in the 2-column grid (when shown): span the full row instead of sitting alone */
    #share-btn-mobile {
      grid-column: 1 / -1;
    }

    /* Eye set keys: rows of six small square keys, each showing a
       preview image of its eye */
    .eye-set-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .eye-set-grid button {
      min-width: 0;
      min-height: 0;
      aspect-ratio: 1 / 1;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Mix: the last key in the grid, under the eye sets */
    .eye-set-grid .mix-eyes-btn {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
    }

    .eye-set-grid img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* The LED would cover the small preview: tuck it into the corner */
    .eye-set-grid button.active::after {
      top: 3px;
      right: 3px;
      width: 5px;
      height: 5px;
    }

    /* Text keys (View, History) are short rather than square so
       the sidebar still fits a 720px-tall viewport. The icon tool keys are
       nested in .tool-dropdown, so they stay square. */
    .sidebar .tools-grid > button {
      aspect-ratio: auto;
      padding: 10px 6px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ---- Fader ----
       The intensity range input, styled as a hardware fader: a dark
       groove and a large blue cap that is easy to grab on touch. */
    .fader-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    input[type="range"] {
      flex: 1;
      min-width: 0;
      height: 32px; /* touch target; the visible groove is thinner */
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      touch-action: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 4px;
      background: var(--screen);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.7);
    }

    input[type="range"]::-moz-range-track {
      height: 8px;
      border-radius: 4px;
      background: var(--screen);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.7);
    }

    /* Blue fader cap with a white centre line */
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 30px;
      margin-top: -11px; /* centre on the 8px track */
      border-radius: 5px;
      background: linear-gradient(90deg, transparent 7px, #ffffff 7px 11px, transparent 11px), var(--te-blue);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 0 #1d4f9e, 0 3px 5px rgba(0,0,0,0.3);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 30px;
      border: none;
      border-radius: 5px;
      background: linear-gradient(90deg, transparent 7px, #ffffff 7px 11px, transparent 11px), var(--te-blue);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 0 #1d4f9e, 0 3px 5px rgba(0,0,0,0.3);
    }

    input[type="range"]:focus-visible {
      outline: 2px solid var(--te-blue);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Tiny OLED-style readout next to the fader */
    .lcd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      padding: 6px 10px;
      background: var(--screen);
      color: #63a4ff;
      font-family: var(--mono);
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      border-radius: 6px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.6);
    }

    /* Brief flash when the value changes (class re-added from scrawl.js) */
    @keyframes lcd-tick {
      from { color: #ffffff; transform: translateY(-1px); }
    }

    .lcd.tick {
      animation: lcd-tick 0.15s ease-out;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-value {
      font-variant-numeric: tabular-nums;
    }

    .tool-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .tool-row button {
      flex: 1;
    }

    select {
      background: #ffffff;
      color: var(--ink);
      border: 1px solid var(--chassis-edge);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 400;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      outline: none;
      flex: 1;
    }

    .color-select {
      min-width: 80px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .custom-dropdown {
      position: relative;
      width: 100%;
    }

    .tool-dropdown {
      position: relative;
      width: 100%;
    }

    .tool-dropdown-button {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 8px;
      border-radius: 10px;
    }

    .tool-dropdown-button.open {
      background: var(--key-down);
    }

    .tool-icon {
      font-size: 28px;
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .tool-label {
      font-size: 11px;
      text-align: center;
      font-weight: 500;
    }

    .size-indicator {
      min-width: 20px;
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Size indicator + arrow: clicking it opens the size list. The negative
       margin enlarges the click target without changing the button layout. */
    .size-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      margin: -4px -8px;
      border-radius: 6px;
    }

    .size-toggle:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .custom-dropdown-content {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 6px;
      background: var(--screen);
      border-radius: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      z-index: 1000;
      display: none;
      max-height: 200px;
      overflow-y: auto;
      padding: 4px;
    }

    .custom-dropdown-content.show {
      display: block;
    }

    .custom-dropdown-option {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 5px;
      transition: background 0.15s;
    }

    .custom-dropdown-option:hover {
      background: rgba(255,255,255,0.12);
    }

    .custom-dropdown-option.selected {
      background: rgba(255,255,255,0.2);
    }

    .brush-preview, .eraser-preview {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .brush-circle {
      background: var(--ink);
      border-radius: 50%;
    }

    /* Inside the dark dropdown the size dots are drawn light */
    .custom-dropdown-content .brush-circle {
      background: #ffffff;
    }

    .eraser-circle {
      background: #ffffff;
      border: 1px solid var(--chassis-edge);
      border-radius: 50%;
    }

    .dropdown-arrow {
      font-size: 10px;
      color: var(--muted);
      transition: transform 0.2s;
    }

    .tool-dropdown-button.open .dropdown-arrow {
      transform: rotate(180deg);
    }

    .color-swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .color-swatches-palette {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
    }

    /* Colour keys: small square caps in the paint colour */
    .color-swatch-btn {
      width: 100%;
      min-width: 0;
      padding: 0;
      aspect-ratio: 1 / 1;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.3),
        0 2px 0 rgba(0,0,0,0.3);
    }

    .color-swatch-btn.selected {
      border-color: var(--chassis);
      transform: translateY(2px);
      box-shadow: 0 0 0 2px var(--ink);
    }

    footer {
      text-align: center;
      padding: 52px 0;
      color: #86868b;
      font-size: 12px;
      line-height: 1.33337;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    @media (max-width: 1068px) {
      .container {
        padding: 0 16px;
      }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 40px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      .subtitle {
        font-size: 17px;
        line-height: 1.47059;
      }

      header {
        padding: 42px 0 18px;
      }

      .canvas-section {
        flex-direction: column;
        min-height: auto;
        padding-bottom: 0;
        /* Break out of .container's side padding so the canvas card can go edge-to-edge */
        background: transparent;
        border-radius: 0;
        box-shadow: none;
        /* Bottom margin clears the fixed toolbar (colour strip + tool buttons) */
        margin: 0 -16px 140px;
      }

      .canvas-area {
        padding: 8px;
      }

      #scrawl-container canvas {
        border-radius: 0;
        box-shadow: none;
      }

      .sidebar {
        display: none;
      }

      .bottom-toolbar {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--chassis);
        border-top: 1px solid var(--chassis-edge);
        padding: 12px 16px;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        z-index: 1000;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 -4px 14px rgba(0, 0, 0, 0.1);
      }

      .toolbar-divider {
        display: none;
      }

      .toolbar-section {
        gap: 8px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 32px;
      }

      .subtitle {
        font-size: 17px;
      }

      header {
        padding: 32px 0 14px;
      }

      .bottom-toolbar {
        padding: 10px 12px;
        gap: 8px;
      }
    }

    /* Short phones: shrink the header so the fixed toolbar doesn't cover the canvas */
    @media (max-width: 768px) and (max-height: 620px) {
      header {
        padding: 12px 0 8px;
      }

      .subtitle {
        display: none;
      }
    }

    @media (min-width: 769px) {
      /* Constrain the layout to the viewport so nothing scrolls, down to a 1024x768 floor */
      .container {
        height: 100vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 12px 0 6px;
      }

      h1 {
        font-size: 26px;
        margin-bottom: 2px;
      }

      .subtitle {
        font-size: 13px;
        margin-top: 2px;
      }

      /* main fills the remaining height; canvas-section (canvas + sidebar) fills main */
      main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 280px;
      }

      .canvas-section {
        grid-column: 1 / -1;
        min-height: 0;
        margin: 16px 0 20px;
        border-radius: 18px;
      }

      .canvas-area {
        min-height: 0;
        min-width: 0;
      }

      /* Canvas scales to fit within the smaller of available width/height.
         #scrawl-container fills the available box and is a size container;
         the canvas element itself stays square (not letterboxed via
         object-fit) so p5's pointer mapping matches what is drawn. */
      #scrawl-container {
        flex: 1;
        min-height: 0;
        min-width: 0;
        width: 100%;
        container-type: size;
      }

      #scrawl-container canvas {
        width: min(100cqw, 100cqh) !important;
        height: min(100cqw, 100cqh) !important;
        max-width: none;
      }

      /* Generate/Intensity controls live in the sidebar - stack to fit its width */
      .canvas-controls {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .canvas-controls .control-group {
        max-width: none;
        gap: 4px;
      }

      /* The sidebar also carries the generate/intensity controls and has
         less height to work with, so tighten its spacing; overflow-y is a
         safety net rather than the norm */
      .sidebar {
        padding: 17px 24px;
        gap: 10px;
        overflow-y: auto;
      }

      .sidebar-section {
        gap: 8px;
      }

      /* Two rows instead of three reclaims ~60px of sidebar height */
      .color-swatches-palette {
        grid-template-columns: repeat(8, 1fr);
      }

      /* Empty footer only adds height */
      footer {
        display: none;
      }
    }

    /* Respect the OS "reduce motion" setting: no transitions or animations
       (the scrawl draw-in is skipped in scrawl.js too) */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Scrawlface</h1>
      <p class="subtitle">Move the eyes, find the face, doodle on top</p>
    </header>

    <main>
      <section class="canvas-section">
        <div class="canvas-area">
          <div id="scrawl-container"></div>
        </div>

        <aside class="sidebar">

          <div class="canvas-controls">
            <button id="generate-btn" class="cta-button">Generate New Scrawl</button>
            <div class="control-group">
              <label for="intensity-slider">Intensity</label>
              <div class="fader-row">
                <input type="range" id="intensity-slider" min="10" max="40" value="20" step="1">
                <span class="lcd" id="intensity-value">20</span>
              </div>
            </div>
          </div>

          <div class="sidebar-section">
            <h3>Tools</h3>
            <div class="tools-grid">
              <div class="tool-dropdown" id="bucket-tool-dropdown">
                <button class="tool-dropdown-button" id="bucket-tool-btn" title="Fill">
                  <div style="height: 5px;"></div>
                  <img src="icons/paint-rollers.png" alt="Paint Roller" class="tool-icon">
                  <div style="height: 4px;"></div>
                </button>
              </div>
              <div class="tool-dropdown" id="brush-tool-dropdown">
                <button class="tool-dropdown-button" id="brush-tool-btn" title="Brush">
                  <img src="icons/paintbrush.png" alt="Paintbrush" class="tool-icon">
                  <div class="size-toggle" title="Choose size">
                    <div class="size-indicator">
                      <div class="brush-circle" id="brush-size-indicator" style="width: 8px; height: 8px;"></div>
                    </div>
                    <span class="dropdown-arrow">▼</span>
                  </div>
                </button>
                <div class="custom-dropdown-content">
                  <div class="custom-dropdown-option" data-value="4">
                    <div class="brush-preview">
                      <div class="brush-circle" style="width: 4px; height: 4px;"></div>
                    </div>
                  </div>
                  <div class="custom-dropdown-option selected" data-value="8">
                    <div class="brush-preview">
                      <div class="brush-circle" style="width: 8px; height: 8px;"></div>
                    </div>
                  </div>
                  <div class="custom-dropdown-option" data-value="12">
                    <div class="brush-preview">
                      <div class="brush-circle" style="width: 12px; height: 12px;"></div>
                    </div>
                  </div>
                  <div class="custom-dropdown-option" data-value="16">
                    <div class="brush-preview">
                      <div class="brush-circle" style="width: 16px; height: 16px;"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="tool-dropdown" id="eraser-tool-dropdown">
                <button class="tool-dropdown-button" id="eraser-tool-btn" title="Eraser">
                  <img src="icons/eraser.png" alt="Eraser" class="tool-icon">
                  <div class="size-toggle" title="Choose size">
                    <div class="size-indicator">
                      <div class="eraser-circle" id="eraser-size-indicator" style="width: 16px; height: 16px;"></div>
                    </div>
                    <span class="dropdown-arrow">▼</span>
                  </div>
                </button>
                <div class="custom-dropdown-content">
                  <div class="custom-dropdown-option" data-value="4">
                    <div class="eraser-preview">
                      <div class="eraser-circle" style="width: 4px; height: 4px;"></div>
                    </div>
                  </div>
                  <div class="custom-dropdown-option" data-value="8">
                    <div class="eraser-preview">
                      <div class="eraser-circle" style="width: 8px; height: 8px;"></div>
                    </div>
                  </div>
                  <div class="custom-dropdown-option" data-value="12">
                    <div class="eraser-preview">
                      <div class="eraser-circle" style="width: 12px; height: 12px;"></div>
                    </div>
                  </div>
                  <div class="custom-dropdown-option selected" data-value="16">
                    <div class="eraser-preview">
                      <div class="eraser-circle" style="width: 16px; height: 16px;"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="sidebar-section">
            <h3>Colours</h3>
            <div class="color-swatches-palette">
              <button type="button" class="color-swatch-btn selected" data-color="#000000" style="background: #000000;" title="Black" aria-label="Black"></button>
              <button type="button" class="color-swatch-btn" data-color="#CC0000" style="background: #CC0000;" title="Red" aria-label="Red"></button>
              <button type="button" class="color-swatch-btn" data-color="#F53524" style="background: #F53524;" title="Orange" aria-label="Orange"></button>
              <button type="button" class="color-swatch-btn" data-color="#FFA64D" style="background: #FFA64D;" title="Tangerine" aria-label="Tangerine"></button>
              <button type="button" class="color-swatch-btn" data-color="#FFF133" style="background: #FFF133;" title="Yellow" aria-label="Yellow"></button>
              <button type="button" class="color-swatch-btn" data-color="#66BD0F" style="background: #66BD0F;" title="Lime" aria-label="Lime"></button>
              <button type="button" class="color-swatch-btn" data-color="#006635" style="background: #006635;" title="Green" aria-label="Green"></button>
              <button type="button" class="color-swatch-btn" data-color="#44A2A2" style="background: #44A2A2;" title="Aqua" aria-label="Aqua"></button>
              <button type="button" class="color-swatch-btn" data-color="#26ACD9" style="background: #26ACD9;" title="Nano Blue" aria-label="Nano Blue"></button>
              <button type="button" class="color-swatch-btn" data-color="#001A80" style="background: #001A80;" title="Blue" aria-label="Blue"></button>
              <button type="button" class="color-swatch-btn" data-color="#372277" style="background: #372277;" title="Purple" aria-label="Purple"></button>
              <button type="button" class="color-swatch-btn" data-color="#CC0099" style="background: #CC0099;" title="Magenta" aria-label="Magenta"></button>
              <button type="button" class="color-swatch-btn" data-color="#F2A6ED" style="background: #F2A6ED;" title="Electric Pink" aria-label="Electric Pink"></button>
              <button type="button" class="color-swatch-btn" data-color="#94056E" style="background: #94056E;" title="Berry" aria-label="Berry"></button>
              <button type="button" class="color-swatch-btn" data-color="#2D1206" style="background: #2D1206;" title="Brown" aria-label="Brown"></button>
            </div>
          </div>

          <div class="sidebar-section">
            <h3>View</h3>
            <div class="tools-grid">
              <button id="rotate-btn" title="Rotate 90°">Rotate canvas</button>
              <button id="toggle-eyes-btn" title="Hide or show the scrawl lines">Hide scrawl</button>
              <button id="move-eyes-btn" title="Move eyes">Move eyes</button>
            </div>
          </div>

          <div class="sidebar-section">
            <h3>Eyes</h3>
            <div class="eye-set-grid">
              <button type="button" data-eye-set="classic" title="Classic eyes" aria-label="Classic eye set" aria-pressed="false"></button>
              <button type="button" data-eye-set="lashes" title="Lashes eyes" aria-label="Lashes eye set" aria-pressed="false"></button>
              <button type="button" data-eye-set="sleepy" title="Sleepy eyes" aria-label="Sleepy eye set" aria-pressed="false"></button>
              <button type="button" data-eye-set="glam" title="Glam eyes" aria-label="Glam eye set" aria-pressed="false"></button>
              <button type="button" data-eye-set="spiky" title="Spiky eyes" aria-label="Spiky eye set" aria-pressed="false"></button>
              <button type="button" data-eye-set="wink" title="Wink eyes" aria-label="Wink eye set" aria-pressed="false"></button>
              <button type="button" data-eye-set="dot" title="Dot eyes" aria-label="Dot eye set" aria-pressed="false"></button>
              <button type="button" data-eye-set="side" title="Side-eye eyes" aria-label="Side-eye eye set" aria-pressed="false"></button>
              <button type="button" data-eye-set="amber" title="Amber eyes" aria-label="Amber eye set" aria-pressed="false"></button>
              <button type="button" data-eye-set="sunny" title="Sunny eyes" aria-label="Sunny eye set" aria-pressed="false"></button>
              <button type="button" data-eye-set="blue" title="Blue eyes" aria-label="Blue eye set" aria-pressed="false"></button>
              <button type="button" class="mix-eyes-btn" title="Give each eye a different random style">Mix</button>
            </div>
          </div>

          <div class="sidebar-section">
            <h3>History</h3>
            <div class="tools-grid history-grid">
              <button id="undo-btn" title="Undo (⌘Z)" disabled>Undo</button>
              <button id="redo-btn" title="Redo (⌘⇧Z)" disabled>Redo</button>
              <button id="clear-drawings-btn" title="Clear drawings" disabled>Clear</button>
              <button id="save-btn" title="Save as PNG">Save</button>
            </div>
          </div>
        </aside>
      </section>

      <!-- Mobile bottom toolbar -->
      <div class="bottom-toolbar">
        <!-- Colour strip - always visible so colours are one tap away -->
        <div class="mobile-color-swatches">
          <button type="button" class="color-swatch-btn-mobile selected" data-color="#000000" style="background: #000000;" title="Black" aria-label="Black"></button>
          <button type="button" class="color-swatch-btn-mobile" data-color="#CC0000" style="background: #CC0000;" title="Red" aria-label="Red"></button>
          <button type="button" class="color-swatch-btn-mobile" data-color="#F53524" style="background: #F53524;" title="Orange" aria-label="Orange"></button>
          <button type="button" class="color-swatch-btn-mobile" data-color="#FFA64D" style="background: #FFA64D;" title="Tangerine" aria-label="Tangerine"></button>
          <button type="button" class="color-swatch-btn-mobile" data-color="#FFF133" style="background: #FFF133;" title="Yellow" aria-label="Yellow"></button>
          <button type="button" class="color-swatch-btn-mobile" data-color="#66BD0F" style="background: #66BD0F;" title="Lime" aria-label="Lime"></button>
          <button type="button" class="color-swatch-btn-mobile" data-color="#006635" style="background: #006635;" title="Green" aria-label="Green"></button>
          <button type="button" class="color-swatch-btn-mobile" data-color="#44A2A2" style="background: #44A2A2;" title="Aqua" aria-label="Aqua"></button>
          <button type="button" class="color-swatch-btn-mobile" data-color="#26ACD9" style="background: #26ACD9;" title="Nano Blue" aria-label="Nano Blue"></button>
          <button type="button" class="color-swatch-btn-mobile" data-color="#001A80" style="background: #001A80;" title="Blue" aria-label="Blue"></button>
          <button type="button" class="color-swatch-btn-mobile" data-color="#372277" style="background: #372277;" title="Purple" aria-label="Purple"></button>
          <button type="button" class="color-swatch-btn-mobile" data-color="#CC0099" style="background: #CC0099;" title="Magenta" aria-label="Magenta"></button>
          <button type="button" class="color-swatch-btn-mobile" data-color="#F2A6ED" style="background: #F2A6ED;" title="Electric Pink" aria-label="Electric Pink"></button>
          <button type="button" class="color-swatch-btn-mobile" data-color="#94056E" style="background: #94056E;" title="Berry" aria-label="Berry"></button>
          <button type="button" class="color-swatch-btn-mobile" data-color="#2D1206" style="background: #2D1206;" title="Brown" aria-label="Brown"></button>
        </div>

        <!-- Main toolbar - always visible -->
        <div class="mobile-toolbar-main">
          <button id="generate-btn-mobile" class="mobile-tool-btn cta-button" title="Generate new scrawl" aria-label="Generate new scrawl">New</button>
          <button id="bucket-tool-btn-mobile" class="mobile-tool-btn" title="Fill">
            <img src="icons/paint-rollers.png" alt="Fill" style="width: 24px; height: 24px;">
          </button>
          <button id="brush-tool-btn-mobile" class="mobile-tool-btn" title="Brush">
            <img src="icons/paintbrush.png" alt="Brush" style="width: 24px; height: 24px;">
          </button>
          <button id="eraser-tool-btn-mobile" class="mobile-tool-btn" title="Eraser">
            <img src="icons/eraser.png" alt="Eraser" style="width: 24px; height: 24px;">
          </button>
          <button id="undo-btn-mobile" class="mobile-tool-btn" title="Undo" aria-label="Undo" disabled>↶</button>
          <button id="toggle-mobile-menu" class="mobile-tool-btn" title="More" aria-label="More options" aria-expanded="false" aria-controls="mobile-expanded-menu">⋯</button>
        </div>

        <!-- Expandable menu - hidden by default -->
        <div class="mobile-toolbar-expanded" id="mobile-expanded-menu" style="display: none;">
          <!-- Brush/Eraser Size -->
          <div class="mobile-section">
            <div class="mobile-section-label" id="mobile-size-label">Brush Size</div>
            <div class="mobile-size-options">
              <button class="mobile-size-btn" data-size="4" aria-label="Size 4">
                <div style="width: 4px; height: 4px; background: #1d1d1f; border-radius: 50%;"></div>
              </button>
              <button class="mobile-size-btn selected" data-size="8" aria-label="Size 8">
                <div style="width: 8px; height: 8px; background: #1d1d1f; border-radius: 50%;"></div>
              </button>
              <button class="mobile-size-btn" data-size="12" aria-label="Size 12">
                <div style="width: 12px; height: 12px; background: #1d1d1f; border-radius: 50%;"></div>
              </button>
              <button class="mobile-size-btn" data-size="16" aria-label="Size 16">
                <div style="width: 16px; height: 16px; background: #1d1d1f; border-radius: 50%;"></div>
              </button>
            </div>
          </div>

          <!-- Eye sets: swappable eye styles (previews drawn by scrawl.js) -->
          <div class="mobile-section">
            <div class="mobile-section-label">Eyes</div>
            <div class="eye-set-grid">
              <button type="button" class="mobile-control-btn" data-eye-set="classic" aria-label="Classic eye set" aria-pressed="false"></button>
              <button type="button" class="mobile-control-btn" data-eye-set="lashes" aria-label="Lashes eye set" aria-pressed="false"></button>
              <button type="button" class="mobile-control-btn" data-eye-set="sleepy" aria-label="Sleepy eye set" aria-pressed="false"></button>
              <button type="button" class="mobile-control-btn" data-eye-set="glam" aria-label="Glam eye set" aria-pressed="false"></button>
              <button type="button" class="mobile-control-btn" data-eye-set="spiky" aria-label="Spiky eye set" aria-pressed="false"></button>
              <button type="button" class="mobile-control-btn" data-eye-set="wink" aria-label="Wink eye set" aria-pressed="false"></button>
              <button type="button" class="mobile-control-btn" data-eye-set="dot" aria-label="Dot eye set" aria-pressed="false"></button>
              <button type="button" class="mobile-control-btn" data-eye-set="side" aria-label="Side-eye eye set" aria-pressed="false"></button>
              <button type="button" class="mobile-control-btn" data-eye-set="amber" aria-label="Amber eye set" aria-pressed="false"></button>
              <button type="button" class="mobile-control-btn" data-eye-set="sunny" aria-label="Sunny eye set" aria-pressed="false"></button>
              <button type="button" class="mobile-control-btn" data-eye-set="blue" aria-label="Blue eye set" aria-pressed="false"></button>
              <button type="button" class="mix-eyes-btn mobile-control-btn" title="Give each eye a different random style">Mix</button>
            </div>
          </div>

          <!-- Other Controls -->
          <div class="mobile-section">
            <div class="mobile-section-label">Controls</div>
            <div class="mobile-controls-grid">
              <button id="rotate-btn-mobile-controls" class="mobile-control-btn">Rotate</button>
              <button id="toggle-eyes-btn-mobile" class="mobile-control-btn">Hide Scrawl</button>
              <button id="move-eyes-btn-mobile" class="mobile-control-btn">Move Eyes</button>
              <button id="redo-btn-mobile" class="mobile-control-btn" disabled>Redo</button>
              <button id="clear-drawings-btn-mobile" class="mobile-control-btn" disabled>Clear</button>
              <button id="save-btn-mobile" class="mobile-control-btn">Save PNG</button>
              <button id="share-btn-mobile" class="mobile-control-btn" hidden>Share</button>
            </div>
          </div>

          <!-- Intensity Slider -->
          <div class="mobile-section">
            <label class="mobile-section-label" for="intensity-slider-mobile">Intensity</label>
            <div class="fader-row">
              <input type="range" id="intensity-slider-mobile" min="10" max="40" value="20" step="1">
              <span class="lcd" id="intensity-value-mobile">20</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p></p>
    </footer>
  </div>
</body>
</html>
