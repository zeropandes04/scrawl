<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the bottom toolbar pad itself clear of the
       iPhone home indicator (env(safe-area-inset-bottom)) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Scrawlface - Generate Pareidolia Art</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <!-- Bump ?v= whenever scrawl.js changes. Browsers cache this page and the
       script separately; without it a phone can run the new page with an old
       script (seen as a stretched canvas). -->
  <script src="scrawl.js?v=17"></script>
  <style>
    /* Control panel look (sidebar + mobile drawer) borrowed from Teenage
       Engineering hardware (OP-1): an aluminium panel, physical keycaps
       that press in, monospaced micro-labels and a fader with an LCD readout. */
    :root {
      --chassis: #d7d6d1;      /* device panel */
      --chassis-edge: #bdbcb6;
      --key: #f6f6f3;          /* keycap face */
      --key-hover: #ffffff;
      --key-edge: #a9a8a2;     /* keycap side, seen below the face */
      --key-down: #e2e1dc;
      --ink: #161616;
      --muted: #55544f;    /* 5.2:1 on --chassis, AA for small text */
      --screen: #161616;
      --te-blue: #2c6fd6;
      --te-green: #2fb35a;
      --te-orange: #ff6b1a;
      --te-orange-edge: #c24e0d;
      --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Option groups are shown/hidden per tool with the hidden attribute;
       this keeps it working on elements whose class sets display */
    [hidden] {
      display: none !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      background: #fbfbfd;
      color: #1d1d1f;
      line-height: 1.47059;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 22px;
    }

    /* Compact one-line header: wordmark, then the tagline beside it (the
       tagline wraps underneath when there isn't room) */
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0 14px;
      padding: 12px 0 8px;
    }

    /* The wordmark's typeface is picked at random on every page load (see
       loadWordmarkFont in scrawl.js). The fixed line box keeps the layout
       identical whichever typeface comes up. */
    h1 {
      font-family: var(--wordmark-font, inherit);
      font-weight: var(--wordmark-weight, 600);
      font-style: var(--wordmark-style, normal);
      font-size: calc(28px * var(--wordmark-scale, 1));
      line-height: 40px;
      height: 40px;
      white-space: nowrap;
      color: #1d1d1f;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 18px;
      color: #6e6e73;
    }

    .canvas-section {
      display: flex;
      gap: 0;
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 2px 4px 12px rgba(0,0,0,0.08);
      margin: 40px 0;
      min-height: 600px;
    }

    .canvas-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      gap: 24px;
    }

    /* The canvas fills this box, whatever its shape; scrawl.js gives the
       canvas the same proportions (fitCanvasToContainer) and centres the
       square drawing inside it. Absolute, so the canvas's own pixel size
       can't push the layout around. */
    #scrawl-container {
      position: relative;
      flex: 1;
      width: 100%;
    }

    /* No frame of its own: the canvas blends into the white area */
    #scrawl-container canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    /* Control panel: styled after Teenage Engineering hardware (OP-1) */
    .sidebar {
      width: 320px;
      flex-shrink: 0;
      background: var(--chassis);
      border-left: 1px solid var(--chassis-edge);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      counter-reset: section;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Numbered micro-labels: "01 scrawl", "02 tools", ... */
    .sidebar-section h3,
    .control-group label,
    .mobile-section-label,
    .hint {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: lowercase;
      letter-spacing: 0.04em;
      margin: 0;
    }

    .sidebar-section h3::before {
      counter-increment: section;
      content: counter(section, decimal-leading-zero);
      display: inline-block;
      margin-right: 8px;
      padding: 0 4px;
      color: var(--chassis);
      background: var(--muted);
      border-radius: 3px;
    }

    /* Unnumbered helper line, e.g. under the eye sets */
    .hint {
      text-transform: none;
    }

    /* Info box: a tip next to a key, as tall as the key. Recessed into the
       panel (not raised like a key) so it doesn't read as a button. */
    .info-box {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.4);
      box-shadow: inset 0 0 0 1px var(--chassis-edge);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .info-box svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Every sidebar key is at least 44px tall: the sidebar is also used
       with fingers on tablets */
    .sidebar button {
      width: 100%;
      min-height: 44px;
    }

    .sidebar .cta-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .cta-button svg {
      width: 20px;
      height: 20px;
    }

    /* Keycap: a light face on a darker edge; pressing pushes the face down */
    button {
      position: relative;
      background: var(--key);
      color: var(--ink);
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      line-height: 1.23536;
      font-weight: 500;
      letter-spacing: -0.01em;
      border-radius: 8px;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        0 2px 0 var(--key-edge),
        0 3px 6px rgba(0,0,0,0.12);
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, background 0.15s;
      min-width: 44px;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    @media (hover: hover) {
      button:hover {
        background: var(--key-hover);
      }
    }

    button:active {
      transform: translateY(2px);
      box-shadow:
        inset 0 1px 2px rgba(0,0,0,0.12),
        0 0 0 var(--key-edge),
        0 1px 2px rgba(0,0,0,0.1);
    }

    button:focus-visible {
      outline: 2px solid var(--te-blue);
      outline-offset: 2px;
    }

    /* Latched key: stays pressed in, with a green LED */
    button.active {
      background: var(--key-down);
      color: var(--ink);
      transform: translateY(2px);
      box-shadow:
        inset 0 1px 3px rgba(0,0,0,0.18),
        0 0 0 var(--key-edge);
    }

    button.active::after {
      content: '';
      position: absolute;
      top: 7px;
      right: 7px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--te-green);
      box-shadow: 0 0 6px var(--te-green);
    }

    @media (hover: hover) {
      button.active:hover {
        background: var(--key-down);
      }
    }

    /* Disabled: a flat outline instead of a raised key */
    button:disabled,
    button:disabled:hover {
      background: transparent;
      color: var(--muted);
      box-shadow: inset 0 0 0 1px var(--chassis-edge);
      cursor: not-allowed;
      transform: none;
    }

    .cta-button {
      background: var(--te-orange);
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.35),
        0 2px 0 var(--te-orange-edge),
        0 3px 6px rgba(0,0,0,0.15);
    }

    @media (hover: hover) {
      .cta-button:hover {
        background: #ff7b33;
      }
    }

    /* ---- Shared toolbar components ----
       The desktop sidebar and the mobile bottom bar are built from the
       same keys (tool keys, size keys, colour swatches, eye sets), so they
       look and behave alike; only the layout around them differs. */

    /* Tool keys: icon over a short label, like an iOS / Android tab bar */
    .tool-keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .tool-key {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 0;
      min-height: 56px;
      padding: 6px 2px;
      font-size: 11px;
      line-height: 1;
      border-radius: 10px;
    }

    .tool-key img,
    .tool-key svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* Options for the selected tool, under the tool keys */
    .tool-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Size keys: a dot drawn at the stroke size, in the brush colour */
    .size-keys {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .size-key {
      min-width: 0;
      min-height: 44px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .size-key .dot,
    .strip-chip .dot {
      border-radius: 50%;
      background: var(--brush-color, var(--ink));
      /* Faint ring so a white dot still shows on the pale key */
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
    }

    /* The eraser's sizes are drawn as white dots with an outline */
    body[data-active-tool="eraser"] .size-key .dot {
      background: #ffffff;
      box-shadow: inset 0 0 0 1.5px var(--muted);
    }

    /* Selected size latches like the tool keys, with a blue ring */
    .size-key.selected {
      background: var(--key-down);
      transform: translateY(2px);
      box-shadow:
        inset 0 1px 3px rgba(0,0,0,0.18),
        0 0 0 2px var(--te-blue);
    }

    /* Colour keys: square caps in the paint colour */
    .swatches {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
    }

    .swatch {
      width: 100%;
      min-width: 0;
      min-height: 0;
      padding: 0;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      border: 2px solid transparent;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.3),
        0 2px 0 rgba(0,0,0,0.3);
    }

    @media (hover: hover) {
      .swatch:hover {
        background: inherit;
        filter: brightness(1.08);
      }
    }

    .swatch.selected {
      border-color: var(--chassis);
      transform: translateY(2px);
      box-shadow: 0 0 0 2px var(--ink);
    }

    /* Eye set keys: square keys, each showing a preview of its eye */
    .eye-set-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .eye-set-grid button {
      min-width: 0;
      min-height: 0;
      aspect-ratio: 1 / 1;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eye-set-grid img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* The LED would cover the small preview: tuck it into the corner */
    .eye-set-grid button.active::after {
      top: 3px;
      right: 3px;
      width: 5px;
      height: 5px;
    }

    /* Rows of text keys: View, History, Save */
    .tools-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .tools-grid.two-keys {
      grid-template-columns: 1fr 1fr;
    }

    .tools-grid > button {
      padding: 8px 6px;
    }

    /* Save spans the row when Share is hidden (no file sharing) */
    .tools-grid.two-keys > :first-child:has(+ [hidden]) {
      grid-column: 1 / -1;
    }

    /* ---- Mobile bottom bar ----
       A bottom sheet with two states, as on iOS and Android:
       - collapsed: a grab handle, one row of options for the selected
         tool, and the tool row, always within thumb reach;
       - expanded: the less frequent controls slide up above them, behind a
         scrim. Open/close by tapping or swiping the handle; close by
         tapping the scrim, pressing Escape or picking a tool. */
    .bottom-toolbar {
      display: none;
    }

    .sheet-scrim {
      display: none;
    }

    /* Grab handle: a full-width target with a small pill in the middle */
    .sheet-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
      height: 24px;
      padding: 0;
      background: transparent;
      box-shadow: none;
      border-radius: 0;
      touch-action: none; /* the swipe is ours, not a page scroll */
    }

    .sheet-handle::before {
      content: '';
      width: 36px;
      height: 5px;
      border-radius: 3px;
      background: var(--key-edge);
    }

    .sheet-handle:active,
    .sheet-handle:hover {
      background: transparent;
      box-shadow: none;
      transform: none;
    }

    /* The expanded part. Animates its height via grid rows (0fr -> 1fr),
       so no height has to be measured in JS. */
    .sheet {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s ease-out;
    }

    .bottom-toolbar.open .sheet {
      grid-template-rows: 1fr;
    }

    .sheet-inner {
      min-height: 0;
      max-height: 50vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .sheet-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 4px 0 16px;
      border-bottom: 1px solid var(--chassis-edge);
      margin-bottom: 8px;
    }

    .mobile-section-label {
      display: block;
      margin-bottom: 8px;
    }

    .mobile-section .hint {
      display: block;
    }

    /* Full-width New scrawl key under the intensity fader in the sheet */
    .new-scrawl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 10px;
    }

    .mobile-control-btn {
      padding: 12px 16px;
      font-size: 14px;
      min-height: 48px;
    }

    /* One row of options for the selected tool (colours, sizes or eyes),
       always the same height so switching tools never moves the bar */
    .strip-row {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 52px;
    }

    /* Horizontal scroller. Padding leaves room for the selected key's ring,
       which overflow would otherwise clip; the fade hints there is more. */
    .strip-scroll {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      padding: 5px 16px 7px 4px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 20px), transparent);
      mask-image: linear-gradient(90deg, #000 calc(100% - 20px), transparent);
    }

    .strip-scroll::-webkit-scrollbar {
      display: none;
    }

    .strip-scroll .swatch,
    .strip-scroll .eye-set-btn {
      flex: none;
      width: 40px;
      height: 40px;
    }

    .options-strip .eye-set-grid {
      display: flex;
      grid-template-columns: none;
    }

    .options-strip .size-keys {
      flex: 1;
      padding: 0 4px;
    }

    /* Leading key of a strip row: switches the brush strip between its
       colours and its sizes, or mixes the eyes */
    .strip-chip {
      flex: none;
      width: 52px;
      min-width: 0;
      height: 44px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .strip-chip .swatch-dot {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--brush-color, var(--ink));
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
    }

    /* Tool row: New | Eyes Brush Eraser Fill | Undo */
    .tool-row {
      display: grid;
      grid-template-columns: 1fr 4fr 1fr;
      gap: 12px;
      padding-top: 4px;
    }

    .tool-row .tool-keys {
      gap: 6px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ---- Fader ----
       The intensity range input, styled as a hardware fader: a dark
       groove and a large blue cap that is easy to grab on touch. */
    .fader-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    input[type="range"] {
      flex: 1;
      min-width: 0;
      height: 32px; /* touch target; the visible groove is thinner */
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      touch-action: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 4px;
      background: var(--screen);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.7);
    }

    input[type="range"]::-moz-range-track {
      height: 8px;
      border-radius: 4px;
      background: var(--screen);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.7);
    }

    /* Blue fader cap with a white centre line */
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 30px;
      margin-top: -11px; /* centre on the 8px track */
      border-radius: 5px;
      background: linear-gradient(90deg, transparent 7px, #ffffff 7px 11px, transparent 11px), var(--te-blue);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 0 #1d4f9e, 0 3px 5px rgba(0,0,0,0.3);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 30px;
      border: none;
      border-radius: 5px;
      background: linear-gradient(90deg, transparent 7px, #ffffff 7px 11px, transparent 11px), var(--te-blue);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 0 #1d4f9e, 0 3px 5px rgba(0,0,0,0.3);
    }

    input[type="range"]:focus-visible {
      outline: 2px solid var(--te-blue);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Tiny OLED-style readout next to the fader */
    .lcd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      padding: 6px 10px;
      background: var(--screen);
      color: #63a4ff;
      font-family: var(--mono);
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      border-radius: 6px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.6);
    }

    /* Brief flash when the value changes (class re-added from scrawl.js).
       Colour only: any movement makes the readout jitter while dragging. */
    @keyframes lcd-tick {
      from { color: #ffffff; }
    }

    .lcd.tick {
      animation: lcd-tick 0.15s ease-out;
    }

    footer {
      text-align: center;
      padding: 52px 0;
      color: #86868b;
      font-size: 12px;
      line-height: 1.33337;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    @media (max-width: 1068px) {
      .container {
        padding: 0 16px;
      }
    }

    @media (max-width: 768px) {
      /* One white surface on phones: no off-white bands around the canvas */
      body {
        background: #ffffff;
      }

      /* The page is at least one screen tall and the canvas area takes all
         the height left over, so the scrawl sits centred between the header
         and the bottom bar. On short screens it simply grows and scrolls. */
      .container {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      /* Empty footer would push the canvas off-centre */
      footer {
        display: none;
      }

      /* Never shorter than it is wide, so the whole drawing always fits; on
         short screens the page scrolls instead */
      #scrawl-container {
        min-height: 100vw;
      }

      .canvas-section {
        flex: 1;
        flex-direction: column;
        min-height: auto;
        padding-bottom: 0;
        /* Break out of .container's side padding so the canvas card can go edge-to-edge */
        background: transparent;
        border-radius: 0;
        box-shadow: none;
        /* Bottom margin clears the collapsed bottom bar (handle + options
           strip + tool row, ~150px) */
        margin: 0 -16px calc(156px + env(safe-area-inset-bottom));
      }

      .sidebar {
        display: none;
      }

      /* The bar is a bottom sheet: rounded top corners, content capped at
         560px wide and centred (tablet portrait), padded clear of the
         iPhone home indicator */
      .bottom-toolbar {
        display: flex;
        flex-direction: column;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--chassis);
        border-top: 1px solid var(--chassis-edge);
        border-radius: 16px 16px 0 0;
        padding: 0 12px calc(8px + env(safe-area-inset-bottom));
        z-index: 1000;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 -4px 14px rgba(0, 0, 0, 0.1);
      }

      .bottom-toolbar > * {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
      }

      /* Dims the canvas while the sheet is open; tapping it closes the sheet */
      .sheet-scrim {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 999;
        background: rgba(0, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease-out;
      }

      .sheet-scrim.show {
        opacity: 1;
        pointer-events: auto;
      }
    }

    @media (max-width: 480px) {
      .bottom-toolbar {
        padding-left: 8px;
        padding-right: 8px;
      }

      .tool-row {
        gap: 6px;
      }
    }

    /* Short phones: shrink the header so the fixed toolbar doesn't cover the canvas */
    @media (max-width: 768px) and (max-height: 620px) {
      header {
        padding: 6px 0 2px;
      }

      .subtitle {
        display: none;
      }
    }

    @media (min-width: 769px) {
      /* Constrain the layout to the viewport so nothing scrolls, down to a 1024x768 floor */
      .container {
        height: 100vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      /* main fills the remaining height; canvas-section (canvas + sidebar) fills main */
      main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 320px;
      }

      .canvas-section {
        grid-column: 1 / -1;
        min-height: 0;
        margin: 16px 0 20px;
        border-radius: 18px;
      }

      .canvas-area {
        min-height: 0;
        min-width: 0;
      }

      #scrawl-container {
        min-height: 0;
        min-width: 0;
      }

      .control-group {
        gap: 4px;
      }

      /* The sidebar has to fit a 768px-tall viewport (tablet landscape) with
         touch-sized keys, so its spacing is tight; overflow-y is a safety
         net rather than the norm */
      .sidebar {
        padding: 16px 20px;
        gap: 14px;
        overflow-y: auto;
      }

      .sidebar-section {
        gap: 8px;
      }

      /* Empty footer only adds height */
      footer {
        display: none;
      }
    }

    /* Respect the OS "reduce motion" setting: no transitions or animations
       (the scrawl draw-in is skipped in scrawl.js too) */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

<body>
  <div class="container">
    <header>

              <button type="button" class="tool-key" data-tool="fill" title="Fill (F)" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10c0-3.5 3-6 7.5-6s8 2.5 8 6.5-3.5 9.5-8.5 9.5-7-5.5-7-10z" fill="currentColor" fill-opacity=".28"/></svg><span>Fill</span></button>
            </div>
            <!-- Options for the selected tool; scrawl.js shows the groups whose
                 data-for lists it -->
            <div class="tool-options">
              <div class="size-keys" data-for="brush eraser" role="group" aria-label="Size">
                <button type="button" class="size-key" data-size="4" aria-label="Size 4" title="Size 4"><span class="dot" style="width: 4px; height: 4px;"></span></button>
                <button type="button" class="size-key selected" data-size="8" aria-label="Size 8" title="Size 8"><span class="dot" style="width: 8px; height: 8px;"></span></button>
                <button type="button" class="size-key" data-size="12" aria-label="Size 12" title="Size 12"><span class="dot" style="width: 12px; height: 12px;"></span></button>
                <button type="button" class="size-key" data-size="16" aria-label="Size 16" title="Size 16"><span class="dot" style="width: 16px; height: 16px;"></span></button>
                <button type="button" class="size-key" data-size="24" aria-label="Size 24" title="Size 24"><span class="dot" style="width: 20px; height: 20px;"></span></button>
                <button type="button" class="size-key" data-size="32" aria-label="Size 32" title="Size 32"><span class="dot" style="width: 24px; height: 24px;"></span></button>
              </div>

                <button type="button" class="swatch" data-color="#FFFFFF" style="background: #FFFFFF;" title="White" aria-label="White"></button>

                  <button type="button" data-eye-set="lashes" title="Lashes eyes" aria-label="Lashes eye set" aria-pressed="false"></button>

                  <button type="button" data-eye-set="side" title="Side-eye eyes" aria-label="Side-eye eye set" aria-pressed="false"></button>

          <div class="sidebar-section">
            <h3>View</h3>

              <button type="button" id="undo-btn" title="Undo (⌘Z)" disabled>Undo</button>

            </div>
